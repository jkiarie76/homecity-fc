
backend:
  name: github
  repo: jkiarie76/homecity-fc
  branch: master

media_folder: public/images/news
public_folder: /images/news

site_url: http://localhost:4321
display_url: http://localhost:4321

collections:
  - name: news
    label: News & Updates
    label_singular: News Item
    folder: src/content/news
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{type}}"
    sortable_fields:
      - publishedAt
      - title
    fields:
      - label: Title
        name: title
        widget: string

      - label: Slug
        name: slug
        widget: string
        hint: "Use lowercase words separated by hyphens. Keep existing article slugs unchanged."

      - label: Summary
        name: summary
        widget: text

      - label: Category
        name: type
        widget: select
        options:
          - { label: Story, value: story }
          - { label: Event, value: event }
          - { label: Memo, value: memo }

      - label: Cover Image
        name: image
        widget: image
        required: true

      - label: Publication Date
        name: publishedAt
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"

      - label: Publication Status
        name: status
        widget: select
        options:
          - { label: Draft, value: draft }
          - { label: Published, value: published }
        default: draft

      - label: Featured
        name: featured
        widget: boolean
        default: false
        required: false

      - label: Event Date
        name: eventDate
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        required: false

      - label: Event Time
        name: eventTime
        widget: string
        required: false

      - label: Venue
        name: venue
        widget: string
        required: false

      - label: Tags
        name: tags
        widget: list
        required: false

      - label: Article Content
        name: body
        widget: markdown

  - name: homepage-settings
    label: Homepage Settings
    description: Edit the homepage hero and latest news display.
    media_folder: public/images/homepage
    public_folder: /images/homepage
    files:
      - name: homepage
        label: Homepage Content
        file: src/content/settings/homepage.md
        fields:
          - label: Season Badge
            name: seasonBadge
            widget: string

          - label: Standings League
            name: standingsLeague
            widget: string
            default: "Kiambu Sub-County League Zone C"

          - label: Standings Season
            name: standingsSeason
            widget: string
            default: "2026/27"

          - label: Welcome Text
            name: welcomeText
            widget: string

          - label: Main Heading
            name: heroTitle
            widget: string

          - label: Subtitle
            name: heroSubtitle
            widget: string

          - label: Club Motto
            name: heroMotto
            widget: string

          - label: Hero Description
            name: heroDescription
            widget: text

          - label: Hero Background Image
            name: heroImage
            widget: image

          - label: Hero Buttons
            name: heroButtons
            widget: list
            min: 1
            max: 3
            fields:
              - label: Button Label
                name: label
                widget: string

              - label: Destination URL
                name: url
                widget: string

              - label: Font Awesome Icon
                name: icon
                widget: string
                hint: "Example: fa-graduation-cap"

          - label: Venue Name
            name: venueName
            widget: string

          - label: Venue Address
            name: venueAddress
            widget: string

          - label: Show Latest News Section
            name: showNewsSection
            widget: boolean
            default: true

          - label: News Section Heading
            name: newsSectionTitle
            widget: string

          - label: Number of News Articles
            name: newsSectionLimit
            widget: number
            value_type: int
            min: 1
            max: 6


  - name: match-center-settings
    label: Match Centre Settings
    description: Edit the Match Centre page sections and display options.
    files:
      - name: match-center
        label: Match Centre Page Settings
        media_folder: public/images
        public_folder: /images
        file: src/content/settings/match-center.md
        fields:
          # HERO
          - label: Hero Label
            name: heroLabel
            widget: string

          - label: Hero Heading First Part
            name: heroTitle
            widget: string

          - label: Hero Heading Highlight
            name: heroHighlight
            widget: string

          - label: Hero Description
            name: heroDescription
            widget: text

          - label: Hero Background Image
            name: heroImage
            widget: image

          # NEXT MATCH
          - label: Next Match Section Label
            name: nextMatchLabel
            widget: string

          - label: Next Match Heading
            name: nextMatchTitle
            widget: string

          # LATEST RESULTS
          - label: Results Section Label
            name: resultsLabel
            widget: string

          - label: Results Heading
            name: resultsTitle
            widget: string

          - label: Number of Results
            name: resultsLimit
            widget: number
            value_type: int
            min: 1
            max: 10

          # FRIENDLIES
          - label: Friendlies Section Label
            name: friendliesLabel
            widget: string

          - label: Friendlies Heading
            name: friendliesTitle
            widget: string

          - label: Number of Friendlies
            name: friendliesLimit
            widget: number
            value_type: int
            min: 1
            max: 20

          # UPCOMING FIXTURES
          - label: Fixtures Section Label
            name: fixturesLabel
            widget: string

          - label: Fixtures Heading
            name: fixturesTitle
            widget: string

          - label: Number of Fixtures
            name: fixturesLimit
            widget: number
            value_type: int
            min: 1
            max: 20

          # LEAGUE TABLE
          - label: Standings Section Label
            name: standingsLabel
            widget: string

          - label: Standings Heading
            name: standingsTitle
            widget: string

          # FINAL CTA
          - label: CTA Background Image
            name: ctaImage
            widget: image

          - label: CTA Eyebrow
            name: ctaEyebrow
            widget: string

          - label: CTA Heading
            name: ctaTitle
            widget: string

          - label: CTA Description
            name: ctaDescription
            widget: text

          - label: CTA Button Text
            name: ctaButtonText
            widget: string

          - label: CTA Button URL
            name: ctaButtonUrl
            widget: string


  - name: matches
    label: Match Center
    label_singular: Match
    folder: src/content/matches
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    summary: "{{matchDate}} — {{homeTeam}} vs {{awayTeam}}"
    sortable_fields:
      - matchDate
      - homeTeam
      - matchStatus
    fields:
      - label: Match Title / Slug
        name: title
        widget: string
        hint: "Example: homecity-fc-vs-rivals-oct-2026"

      - label: Match Date
        name: matchDate
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"

      - label: Kickoff Time
        name: kickoffTime
        widget: string
        hint: "Example: 15:00 EAT"

      - label: Home Team
        name: homeTeam
        widget: string

      - label: Away Team
        name: awayTeam
        widget: string

      - label: Home Team Score
        name: homeScore
        widget: number
        value_type: int
        min: 0
        required: false

      - label: Away Team Score
        name: awayScore
        widget: number
        value_type: int
        min: 0
        required: false

      - label: Competition
        name: competition
        widget: string

      - label: Venue
        name: venue
        widget: string

      - label: Match Status
        name: matchStatus
        widget: select
        options:
          - { label: Upcoming, value: upcoming }
          - { label: Completed, value: completed }
          - { label: Postponed, value: postponed }
          - { label: Cancelled, value: cancelled }
        default: upcoming

      - label: Feature on Homepage
        name: featured
        widget: boolean
        default: false

      - label: Match Report URL
        name: reportUrl
        widget: string
        required: false

      - label: Match Notes
        name: body
        widget: markdown
        required: false

  - name: standings
    label: League Standings
    label_singular: Team Standing
    folder: src/content/standings
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    summary: "{{league}} — {{team}} — {{points}} pts"
    sortable_fields:
      - position
      - team
      - points
    fields:
      - label: Record Title
        name: title
        widget: string

      - label: League
        name: league
        widget: string

      - label: Season
        name: season
        widget: string
        hint: "Example: 2026/27"

      - label: Team Name
        name: team
        widget: string

      - label: Position
        name: position
        widget: number
        value_type: int
        min: 1

      - label: Matches Played
        name: played
        widget: number
        value_type: int
        min: 0

      - label: Wins
        name: wins
        widget: number
        value_type: int
        min: 0

      - label: Draws
        name: draws
        widget: number
        value_type: int
        min: 0

      - label: Losses
        name: losses
        widget: number
        value_type: int
        min: 0

      - label: Goals For
        name: goalsFor
        widget: number
        value_type: int
        min: 0

      - label: Goals Against
        name: goalsAgainst
        widget: number
        value_type: int
        min: 0

      - label: Points
        name: points
        widget: number
        value_type: int
        min: 0

  - name: products
    label: Fan Shop Products
    label_singular: Product
    folder: src/content/products
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — KES {{price}}"
    media_folder: public/images/products
    public_folder: /images/products
    sortable_fields:
      - sortOrder
      - title
      - price
    fields:
      - label: Product Name
        name: title
        widget: string

      - label: Slug
        name: slug
        widget: string
        hint: "Use lowercase words separated by hyphens, e.g. home-jersey-2026."

      - label: Description
        name: description
        widget: text

      - label: Product Image
        name: image
        widget: image

      - label: Price (KES)
        name: price
        widget: number
        value_type: int
        min: 1

      - label: Category
        name: category
        widget: select
        options:
          - { label: Jerseys, value: Jerseys }
          - { label: Training Wear, value: Training Wear }
          - { label: Accessories, value: Accessories }
          - { label: Other, value: Other }

      - label: Publication Status
        name: status
        widget: select
        options:
          - { label: Draft, value: draft }
          - { label: Published, value: published }
        default: draft

      - label: Stock Availability
        name: stockStatus
        widget: select
        options:
          - { label: In Stock, value: in-stock }
          - { label: Out of Stock, value: out-of-stock }
        default: in-stock

      - label: Feature on Homepage
        name: featured
        widget: boolean
        default: false

      - label: Display Order
        name: sortOrder
        widget: number
        value_type: int
        min: 0
        default: 0

  - name: fan-shop-settings
    label: Fan Shop Settings
    files:
      - name: fan-shop
        label: Fan Shop Page Settings
        file: src/content/settings/fan-shop.md
        fields:
          - { label: Hero Eyebrow, name: heroEyebrow, widget: string }
          - { label: Hero Title, name: heroTitle, widget: string }
          - { label: Hero Highlight, name: heroHighlight, widget: string }
          - { label: Hero Description, name: heroDescription, widget: text }
          - { label: Hero Button Text, name: heroButtonText, widget: string }
          - { label: Hero Button URL, name: heroButtonUrl, widget: string }
          - { label: Collection Eyebrow, name: collectionEyebrow, widget: string }
          - { label: Collection Title, name: collectionTitle, widget: string }
          - { label: Collection Description, name: collectionDescription, widget: text }
          - { label: Show Ordering Notice, name: showOrderingNotice, widget: boolean, default: true }
          - { label: Ordering Notice, name: orderingNotice, widget: text }
          - { label: Empty Products Message, name: emptyProductsMessage, widget: text }
